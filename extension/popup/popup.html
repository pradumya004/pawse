<!--
  popup/popup.html
  The panel that opens when you click the Pawse toolbar icon.
  Pixel-cat themed (see docs/DESIGN.md). Structure only — logic in popup.js,
  look in popup.css. Loads config.js so popup.js can read PAWSE_CONFIG.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- CRT scanline overlay for retro feel -->
    <div class="scanlines" aria-hidden="true"></div>

    <div class="wrap">
      <!-- Mascot + wordmark -->
      <div class="header">
        <div class="cat" id="cat">🐱</div>
        <h1 class="logo">PAWSE</h1>
      </div>

      <div id="status" class="status">
        <span class="dot" id="dot"></span><span id="statusText">OFFLINE</span>
      </div>

      <button id="createBtn" class="btn primary">CREATE ROOM</button>

      <div class="divider"><span>OR</span></div>

      <div class="join">
        <input id="roomInput" class="input" placeholder="CODE" maxlength="6" />
        <button id="joinBtn" class="btn">JOIN</button>
      </div>

      <div id="roomBox" class="room hidden">
        <span class="label">ROOM</span>
        <span id="roomCode" class="code">------</span>
        <button id="copyBtn" class="btn small">COPY</button>
      </div>

      <!-- partner presence (only shown while in a room) -->
      <div id="partnerBox" class="partner hidden">
        <span class="pcat">🐱</span><span id="partnerText">waiting for partner...</span>
      </div>

      <!-- leave (only shown while in a room) -->
      <button id="leaveBtn" class="btn leave hidden">LEAVE ROOM</button>

      <div class="footer">watch together<br />purr-fectly in sync</div>
    </div>

    <script src="../config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
