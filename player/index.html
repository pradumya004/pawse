<!--
  player/index.html — Pawse own-files P2P player (Track B).

  A standalone web page (no extension needed). One person (host) picks a local
  movie file; the other (partner) joins the room and watches it streamed
  peer-to-peer over WebRTC. Play/pause/seek stay in sync via the same relay.

  This is a self-contained static page — deployable free to GitHub Pages/Vercel,
  or just opened directly. Loads config.js for PAWSE_CONFIG, then player.js.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pawse — Watch Together</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <svg class="cat" viewBox="0 0 20 18" shape-rendering="crispEdges" aria-hidden="true">
          <rect x="4" y="2" width="2" height="1" fill="#ef7d1a" />
          <rect x="3" y="3" width="4" height="1" fill="#ef7d1a" />
          <rect x="14" y="2" width="2" height="1" fill="#ef7d1a" />
          <rect x="13" y="3" width="4" height="1" fill="#ef7d1a" />
          <rect x="4" y="3" width="1" height="1" fill="#e85d86" />
          <rect x="15" y="3" width="1" height="1" fill="#e85d86" />
          <rect x="3" y="4" width="14" height="11" fill="#ef7d1a" />
          <rect x="7" y="4" width="1" height="2" fill="#d9660a" />
          <rect x="10" y="4" width="1" height="2" fill="#d9660a" />
          <rect x="12" y="4" width="1" height="2" fill="#d9660a" />
          <rect x="6" y="8" width="2" height="3" fill="#2a2438" />
          <rect x="12" y="8" width="2" height="3" fill="#2a2438" />
          <rect x="6" y="8" width="1" height="1" fill="#fff" />
          <rect x="12" y="8" width="1" height="1" fill="#fff" />
          <rect x="9" y="11" width="2" height="1" fill="#e85d86" />
          <rect x="8" y="12" width="1" height="1" fill="#2a2438" />
          <rect x="11" y="12" width="1" height="1" fill="#2a2438" />
          <rect x="0" y="8" width="3" height="1" fill="#2a2438" />
          <rect x="0" y="10" width="3" height="1" fill="#2a2438" />
          <rect x="17" y="8" width="3" height="1" fill="#2a2438" />
          <rect x="17" y="10" width="3" height="1" fill="#2a2438" />
        </svg>
        <span class="logo">PAWSE</span>
      </div>
      <div id="status" class="status"><span class="dot" id="dot"></span><span id="statusText">NOT CONNECTED</span></div>
    </header>

    <main class="stage">
      <!-- ============ LOBBY ============ -->
      <section id="lobby" class="card">
        <h2 class="cardTitle">watch your own movies, together</h2>
        <p class="cardSub">one of you picks a file — the other just joins. no accounts, no uploads.</p>

        <label class="label" for="nameInput">WHO ARE YOU?</label>
        <input id="nameInput" class="input" placeholder="your name" maxlength="12" />

        <button id="createBtn" class="btn primary">START A ROOM (I HAVE THE FILE)</button>

        <div class="divider"><span>OR JOIN YOUR PARTNER</span></div>

        <div class="join">
          <input id="roomInput" class="input" placeholder="ROOM CODE" maxlength="6" />
          <button id="joinBtn" class="btn">JOIN</button>
        </div>
      </section>

      <!-- ============ ROOM ============ -->
      <section id="room" class="hidden">
        <div class="roombar">
          <div class="roomcode"><span class="label">ROOM</span> <span id="roomCode" class="code">------</span></div>
          <button id="copyBtn" class="btn small">📋 COPY CODE</button>
          <div id="partnerText" class="partner">waiting for your partner...</div>
          <button id="leaveBtn" class="btn small leave">LEAVE</button>
        </div>

        <!-- Host-only: pick a file to stream -->
        <div id="hostControls" class="filepick hidden">
          <label for="fileInput" class="btn primary filebtn">🎬 CHOOSE A MOVIE FILE</label>
          <input id="fileInput" type="file" accept="video/*" hidden />
          <span id="fileName" class="filename"></span>
        </div>

        <div class="videowrap">
          <video id="video" class="video" controls playsinline></video>
          <div id="videoHint" class="videohint"></div>
        </div>
      </section>
    </main>

    <footer class="pagefoot">watch together, purr-fectly in sync 🐾</footer>

    <script src="config.js"></script>
    <script src="player.js"></script>
  </body>
</html>
