<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- pixel-cat favicon (matches the in-app mascot) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#ef7d1a" />

    <!-- LCP image (Meow Feed poster) and the pixel font, fetched before the JS bundle -->
    <link rel="preload" as="image" href="/meow-poster.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="font" href="/PressStart2P.woff" type="font/woff" crossorigin />

    <title>🐾 Pawse — watch movies together, from anywhere</title>
    <meta
      name="description"
      content="Pawse lets you and your person watch movies in perfect sync — with webcam, voice, and chat. Free, cozy, and cat-themed. 🐱"
    />

    <!-- social preview (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pawsetv.vercel.app" />
    <meta property="og:title" content="🐾 Pawse — watch movies together, from anywhere" />
    <meta
      property="og:description"
      content="Watch movies in perfect sync with your person — webcam, voice & chat. Free & cat-themed. 🐱"
    />
    <meta property="og:image" content="https://pawsetv.vercel.app/favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="🐾 Pawse — watch together" />
    <meta
      name="twitter:description"
      content="Watch movies in perfect sync with your person — webcam, voice & chat. Free & cat-themed. 🐱"
    />
    <meta name="twitter:image" content="https://pawsetv.vercel.app/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
